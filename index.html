<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pax 3 — Contrôle</title>
<script src="https://cdn.jsdelivr.net/npm/aes-js@3.1.2/index.js"></script>
<style>
  :root{
    --bg:#15181d; --panel:#1e232b; --line:#2c333d; --ink:#e8eaed; --muted:#8b95a3;
    --heat:#e8933a; --heat-soft:#3a2c1a; --wake:#4aa3ff; --ok:#5bc98a; --bad:#e8735a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; padding:24px 18px 40px; max-width:560px; margin:0 auto; -webkit-font-smoothing:antialiased;}
  header{display:flex; align-items:center; gap:14px; margin-bottom:22px}
  .glow{width:16px; height:16px; border-radius:50%; background:var(--muted); flex:0 0 auto; transition:background .3s}
  .glow.wake{background:var(--wake); animation:pulse 1.1s ease-in-out infinite}
  .glow.on{background:var(--heat); box-shadow:0 0 14px 2px rgba(232,147,58,.55)}
  .glow.err{background:var(--bad)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,163,255,.5)}50%{box-shadow:0 0 14px 4px rgba(74,163,255,.15)}}
  @media (prefers-reduced-motion:reduce){.glow.wake{animation:none}}
  h1{font-size:1.15rem; font-weight:600; margin:0}
  .state{color:var(--muted); font-size:.9rem; margin-top:1px}
  label{display:block; font-size:.8rem; color:var(--muted); margin-bottom:6px}
  input{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-family:var(--mono); font-size:1.05rem; padding:13px 14px; letter-spacing:.12em; text-transform:uppercase;}
  input:focus{outline:none; border-color:var(--heat)}
  button{width:100%; border:none; border-radius:12px; padding:15px 18px; font-size:1rem; font-weight:600;
    color:#160d03; background:var(--heat); cursor:pointer; transition:opacity .15s; margin-top:12px}
  button:active{opacity:.8}
  button.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500}
  button:disabled{opacity:.4; cursor:default}
  .row{display:flex; gap:10px}
  .row button{flex:1}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:18px}
  .panel h2{font-size:.78rem; font-weight:600; color:var(--muted); margin:0 0 12px; letter-spacing:.02em}
  .metric{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-top:1px solid var(--line)}
  .metric:first-of-type{border-top:none}
  .metric .lab{color:var(--muted); font-size:.9rem}
  .metric .val{font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums}
  .metric .val small{font-size:.85rem; color:var(--muted); font-weight:500; margin-left:4px}
  .metric .val.empty{color:var(--muted); font-size:1rem; font-weight:400}
  #log{font-family:var(--mono); font-size:.78rem; color:var(--muted); white-space:pre-wrap; word-break:break-all;
    max-height:240px; overflow:auto; margin:0}
  #log b{color:var(--ink); font-weight:600}
  #log .g{color:var(--ok)}
  .hidden{display:none}
</style>
</head>
<body>

<header>
  <div class="glow" id="glow"></div>
  <div>
    <h1>Pax 3 — Contrôle</h1>
    <div class="state" id="state">Prêt</div>
  </div>
</header>

<div id="setup">
  <label for="serial">Numéro de série (8 caractères, gravé sous le four)</label>
  <input id="serial" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX">
  <button id="connect">Connecter le Pax</button>
</div>

<div class="row hidden" id="actions">
  <button class="ghost" id="read">Lire l'état</button>
  <button class="ghost" id="disconnect">Déconnecter</button>
</div>

<div class="panel hidden" id="stateCard">
  <h2>État de l'appareil</h2>
  <div class="metric"><span class="lab">Batterie</span><span class="val empty" id="mBatt">—</span></div>
  <div class="metric"><span class="lab">Température actuelle</span><span class="val empty" id="mTemp">—</span></div>
  <div class="metric"><span class="lab">Température cible</span><span class="val empty" id="mTarget">—</span></div>
</div>

<div class="panel hidden" id="logCard">
  <h2>Journal</h2>
  <pre id="log"></pre>
</div>

<script>
"use strict";

const PAX_SERVICE = "8e320200-64d2-11e6-bdf4-0800200c9a66";
const C_READ   = "8e320201-64d2-11e6-bdf4-0800200c9a66"; // read
const C_WRITE  = "8e320202-64d2-11e6-bdf4-0800200c9a66"; // writeNR (commandes)
const C_NOTIFY = "8e320203-64d2-11e6-bdf4-0800200c9a66"; // read + notify (état)
const KEYKEY_HEX = "F7C866C38F78753086293BD57DD32540";   // clé fixe extraite de l'appli Pax

const $ = id => document.getElementById(id);
const glow = $("glow"), state = $("state");
let device=null, server=null, deviceKey=null;
let cRead=null, cNotify=null;

// --- persistance du numéro de série (page perso, localStorage OK) ---
try{ const s = localStorage.getItem("paxSerial"); if(s) $("serial").value = s; }catch(e){}

function setState(t, m){ state.textContent=t; glow.className="glow"+(m?" "+m:""); }
function show(id){ $(id).classList.remove("hidden"); }
function hide(id){ $(id).classList.add("hidden"); }
function log(msg, cls){
  show("logCard");
  const t=new Date().toLocaleTimeString("fr-CA");
  const line = cls==="b" ? `<b>[${t}] ${msg}</b>` : cls==="g" ? `<span class="g">[${t}] ${msg}</span>` : `[${t}] ${msg}`;
  $("log").insertAdjacentHTML("beforeend", line+"\n");
  $("log").scrollTop = $("log").scrollHeight;
}
function hex(arr){ return Array.from(arr, x=>x.toString(16).padStart(2,"0")).join(" "); }

// --- dérivation de clé (vérifiée) : AES-ECB(serial+serial) avec la clé fixe ---
function deriveKey(serial){
  const keykey = aesjs.utils.hex.toBytes(KEYKEY_HEX);
  const input = aesjs.utils.utf8.toBytes(serial + serial); // 16 octets
  const ecb = new aesjs.ModeOfOperation.ecb(keykey);
  return ecb.encrypt(input); // clé de 16 octets propre à l'appareil
}

// --- déchiffrement d'un paquet de 32 octets : plain = ct XOR AES-ECB(deviceKey, iv) ---
function decryptPacket(bytes){
  if(bytes.length < 32) return null;
  const ct = bytes.slice(0,16), iv = bytes.slice(16,32);
  const ecb = new aesjs.ModeOfOperation.ecb(deviceKey);
  const ks = ecb.encrypt(iv);
  const plain = new Uint8Array(16);
  for(let i=0;i<16;i++) plain[i] = ct[i] ^ ks[i];
  return plain;
}

const TYPES = {1:"Temp actuelle",2:"Temp cible",3:"Batterie",4:"Usage",5:"Usage limite",
  6:"Verrouillage",7:"Charge",8:"Pod",17:"Plages chauffage",20:"Attributs"};

function tempFromRaw(raw16){                 // hypothèse à calibrer : dixièmes de °C
  const c = raw16/10;
  const f = Math.round(c*9/5+32);
  return {c:c.toFixed(1), f};
}

function handlePlain(plain){
  const type = plain[0];
  const name = TYPES[type] || ("type "+type);
  if(type===3){                              // batterie
    const pct = plain[1];
    $("mBatt").textContent = pct+" %"; $("mBatt").className="val";
    log(`${name} : ${pct} %`, "g");
  }else if(type===1 || type===2){            // températures
    const raw = plain[1] | (plain[2]<<8);
    const t = tempFromRaw(raw);
    const el = type===1 ? $("mTemp") : $("mTarget");
    el.innerHTML = `${t.c} <small>°C · ${t.f} °F</small>`; el.className="val";
    log(`${name} : brut16=${raw} → ${t.c}°C / ${t.f}°F`, "g");
  }else{
    log(`${name} — ${hex(plain)}`);
  }
}

function onValue(dv, srcLabel){
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  if(bytes.length >= 32){
    const plain = decryptPacket(bytes);
    log(`${srcLabel} (${bytes.length}o) déchiffré`, "b");
    handlePlain(plain);
  }else{
    log(`${srcLabel} (${bytes.length}o) : ${hex(bytes)}`);   // trop court pour un paquet chiffré
  }
}

async function readOnce(){
  try{
    if(cNotify){ const v = await cNotify.readValue(); onValue(v, "lecture 0203"); }
    if(cRead){   const v = await cRead.readValue();   onValue(v, "lecture 0201"); }
  }catch(err){ log("Lecture impossible : "+err.message); }
}

async function connect(){
  const serial = $("serial").value.trim().toUpperCase();
  if(serial.length !== 8){ setState("Numéro de série : 8 caractères requis","err"); return; }
  if(!window.aesjs){ setState("Librairie AES non chargée (réseau ?)","err"); return; }
  if(!navigator.bluetooth){ setState("Web Bluetooth indisponible — Chrome/Android en HTTPS","err"); return; }

  try{ localStorage.setItem("paxSerial", serial); }catch(e){}
  deviceKey = deriveKey(serial);
  log("Clé de l'appareil dérivée du numéro de série", "b");

  try{
    setState("Sélection de l'appareil…","wake");
    device = await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"PAX"}], optionalServices:[PAX_SERVICE]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);

    setState("Connexion…","wake");
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(PAX_SERVICE);
    cRead   = await svc.getCharacteristic(C_READ);
    cNotify = await svc.getCharacteristic(C_NOTIFY);

    await cNotify.startNotifications();
    cNotify.addEventListener("characteristicvaluechanged", e => onValue(e.target.value, "notif 0203"));
    log("Connecté — abonné aux notifications", "b");

    setState("Connecté","on");
    hide("setup"); show("actions"); show("stateCard");

    await readOnce();   // état initial
    log("Astuce : réveille le Pax ou change la température dessus pour voir arriver les valeurs.");
  }catch(err){
    if(err.name==="NotFoundError"){ setState("Aucun appareil sélectionné",""); }
    else{ setState("Erreur : "+err.message,"err"); log("ERREUR : "+err.message,"b"); }
  }
}

function onDisconnected(){
  setState("Déconnecté","");
  show("setup"); hide("actions");
  log("Appareil déconnecté","b");
}

$("connect").addEventListener("click", connect);
$("read").addEventListener("click", readOnce);
$("disconnect").addEventListener("click", ()=>{ if(device && device.gatt.connected) device.gatt.disconnect(); });
</script>
</body>
</html>
